name: Test and coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run coverage
        run: ./test.sh
      - name: Upload coverage to Codecov
        run: bash <(curl -s https://codecov.io/bash)
